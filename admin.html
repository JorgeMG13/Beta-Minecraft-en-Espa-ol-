<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root{--green-dark:#1a6b00;--green-light:#4fc800;--admin-bg:#1a0a00;--admin-border:#c8640a;--danger:#c82828;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Press Start 2P",monospace;background:var(--admin-bg);min-height:100vh;color:#fff;}
    #admin-panel{display:flex;flex-direction:column;min-height:100vh;}
    .admin-header{background:#0d0600;border-bottom:3px solid var(--admin-border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
    .admin-header h1{font-size:clamp(9px,1.8vw,13px);color:var(--admin-border);}
    .admin-meta{font-size:7px;color:#888;}
    .admin-body{padding:24px;display:flex;flex-direction:column;gap:32px;max-width:700px;width:100%;margin:0 auto;}
    .admin-section-title{font-size:clamp(9px,1.6vw,11px);color:var(--admin-border);border-bottom:2px solid #3a1500;padding-bottom:10px;margin-bottom:18px;}
    .admin-form{display:flex;flex-direction:column;gap:12px;}
    .admin-form label{font-size:8px;color:#aaa;}
    .admin-form input,.admin-form textarea,.admin-form select{width:100%;background:#0d0600;border:2px solid #3a1500;color:#fff;font-family:"Press Start 2P",monospace;font-size:8px;padding:10px;outline:none;border-radius:0;}
    .admin-form textarea{min-height:100px;resize:vertical;}
    .admin-form select{cursor:pointer;}
    .btn-admin{font-family:"Press Start 2P",monospace;font-size:8px;padding:10px 16px;cursor:pointer;border:none;border-top:3px solid rgba(255,255,255,0.3);border-left:3px solid rgba(255,255,255,0.3);border-bottom:3px solid rgba(0,0,0,0.5);border-right:3px solid rgba(0,0,0,0.5);text-transform:uppercase;letter-spacing:1px;}
    .btn-publish{background:#1a5c00;color:#fff;}.btn-publish:hover{background:#2d9e00;}
    .btn-exit{background:#3a0000;color:#f88;}.btn-exit:hover{background:#5a0000;}
    .btn-delete{background:var(--danger);color:#fff;font-size:7px;padding:6px 10px;}.btn-delete:hover{background:#e03030;}
    .quiz-opt-row{display:flex;align-items:center;gap:8px;background:#0a0400;border:1px solid #3a1500;padding:8px 10px;margin-bottom:6px;}
    .quiz-opt-row input[type=text]{flex:1;}
    .quiz-opt-row input[type=radio]{cursor:pointer;width:16px;height:16px;}
    .quiz-opt-row label{font-size:7px;color:#888;white-space:nowrap;}
    .btn-add-opt{background:#0a2a00;color:#4fc800;border:2px dashed #4fc800;font-family:"Press Start 2P",monospace;font-size:7px;padding:8px;cursor:pointer;width:100%;margin-top:4px;}
    .admin-posts-list{display:flex;flex-direction:column;gap:8px;}
    .admin-post-item{display:flex;align-items:center;justify-content:space-between;background:#0d0600;border:2px solid #3a1500;padding:10px 14px;gap:12px;flex-wrap:wrap;}
    .admin-post-item .info h4{font-size:8px;color:#ddd;margin-bottom:4px;}
    .admin-post-item .info span{font-size:6px;color:#666;}
    .selector-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
    .tab-btn{font-family:"Press Start 2P",monospace;font-size:7px;padding:8px 12px;cursor:pointer;border:2px solid #3a1500;background:#0d0600;color:#888;}
    .tab-btn.active{background:#3a1500;color:var(--admin-border);}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#222;border:2px solid var(--green-light);color:#fff;font-size:8px;padding:12px 20px;z-index:9999;opacity:0;transition:all 0.3s;white-space:nowrap;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    #access-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-size:11px;color:#c82828;text-align:center;line-height:2;}
  </style>
</head>
<body>
  <div id="access-denied" style="display:none;">
    &#128274; ACCESO DENEGADO<br>
    <span style="font-size:8px;color:#888;">Vuelve al inicio e introduce la contrase&ntilde;a</span>
    <br><br>
    <a href="index.html" style="color:#c8640a;font-size:7px;text-decoration:none;">&larr; VOLVER AL INICIO</a>
  </div>
  <div id="admin-panel" style="display:none;">
    <div class="admin-header">
      <h1>&#9881;&#65039; PANEL DE DESARROLLADOR</h1>
      <div>
        <span class="admin-meta">Sesi&oacute;n activa</span>
        <button class="btn-admin btn-exit" style="margin-left:12px;" onclick="cerrarSesion()">&#10005; CERRAR SESI&Oacute;N</button>
      </div>
    </div>
    <div class="admin-body">
      <div>
        <p class="admin-section-title">&#10133; NUEVA PUBLICACI&Oacute;N</p>
        <div class="admin-form">
          <label>TIPO DE CONTENIDO</label>
          <select id="tipo-contenido" onchange="cambiarFormulario()">
            <option value="noticia">&#128240; NOTICIA</option>
            <option value="curiosidad">&#128161; DATO CURIOSO</option>
            <option value="quiz">&#10067; QUIZ</option>
          </select>
          <div id="form-noticia">
            <label>T&iacute;tulo</label>
            <input type="text" id="n-titulo" placeholder="T&iacute;tulo de la noticia..." />
            <label>Imagen (URL, opcional)</label>
            <input type="text" id="n-imagen" placeholder="https://... (opcional)" />
            <label>Texto</label>
            <textarea id="n-texto" placeholder="Escribe el contenido de la noticia..."></textarea>
            <button class="btn-admin btn-publish" onclick="publicarNoticia()">&#9654; PUBLICAR NOTICIA</button>
          </div>
          <div id="form-curiosidad" style="display:none;">
            <label>Texto del dato curioso</label>
            <textarea id="c-texto" placeholder="Escribe el dato curioso..."></textarea>
            <button class="btn-admin btn-publish" onclick="publicarCuriosidad()">&#9654; PUBLICAR CURIOSIDAD</button>
          </div>
          <div id="form-quiz" style="display:none;">
            <label>Pregunta</label>
            <input type="text" id="q-pregunta" placeholder="Escribe la pregunta..." />
            <label>Opciones (marca la correcta)</label>
            <div id="quiz-opciones">
              <div class="quiz-opt-row">
                <input type="radio" name="q-correcta" value="0" checked />
                <label>&#10003;</label>
                <input type="text" class="q-opt" placeholder="Opci&oacute;n 1..." />
              </div>
              <div class="quiz-opt-row">
                <input type="radio" name="q-correcta" value="1" />
                <label>&#10003;</label>
                <input type="text" class="q-opt" placeholder="Opci&oacute;n 2..." />
              </div>
            </div>
            <button class="btn-add-opt" onclick="addOpcion()">+ A&Ntilde;ADIR OPCI&Oacute;N</button>
            <button class="btn-admin btn-publish" style="margin-top:12px;" onclick="publicarQuiz()">&#9654; PUBLICAR QUIZ</button>
          </div>
        </div>
      </div>
      <div>
        <p class="admin-section-title">&#128203; CONTENIDO PUBLICADO</p>
        <div class="selector-tabs">
          <button class="tab-btn active" onclick="switchAdminTab('noticia', this)">&#128240; NOTICIAS</button>
          <button class="tab-btn" onclick="switchAdminTab('curiosidad', this)">&#128161; DATOS CURIOSOS</button>
          <button class="tab-btn" onclick="switchAdminTab('quiz', this)">&#10067; QUIZ</button>
        </div>
        <div id="admin-list" class="admin-posts-list"></div>
      </div>
    </div>
  </div>
  <div id="toast"></div>
