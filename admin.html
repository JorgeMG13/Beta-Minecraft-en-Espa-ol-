<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-dark: #1a6b00;
      --green-light: #4fc800;
      --admin-bg: #120800;
      --admin-border: #c8640a;
      --danger: #7a0000;
      --input-bg: #0a0400;
      --panel-border: #3a1500;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Press Start 2P", monospace;
      background: var(--admin-bg);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }
    .admin-header {
      background: #000;
      border-bottom: 2px solid var(--admin-border);
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-header h1 {
      font-size: 10px;
      color: var(--admin-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-header .status {
      font-size: 7px;
      color: #666;
      text-transform: lowercase;
    }
    .btn-exit {
      background: #330000;
      color: #ff4444;
      border: 1px solid #ff4444;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      padding: 8px 15px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-exit:hover { background: #550000; }

    .admin-body {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .section-header {
      color: var(--admin-border);
      font-size: 9px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 40px;
    }
    .admin-form label {
      font-size: 8px;
      color: #888;
      margin-bottom: 5px;
    }
    .admin-form select, .admin-form input, .admin-form textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-family: "Press Start 2P", monospace;
      font-size: 8px;
      padding: 12px;
      outline: none;
    }
    .admin-form select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23c8640a%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 12px top 50%;
      background-size: 8px auto;
    }
    .admin-form textarea { min-height: 120px; resize: none; }

    .btn-publish {
      background: #1a5c00;
      color: #fff;
      border: 1px solid #4fc800;
      font-family: "Press Start 2P", monospace;
      font-size: 9px;
      padding: 15px;
      cursor: pointer;
      margin-top: 10px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-publish:hover { background: #227a00; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: #666;
      font-family: "Press Start 2P", monospace;
      font-size: 7px;
      padding: 10px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn.active {
      color: var(--admin-border);
      border-color: var(--admin-border);
    }

    #admin-list {
      border-top: 1px solid var(--panel-border);
      padding-top: 20px;
      font-size: 7px;
      color: #555;
    }

    .admin-post-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0a0400;
      border: 1px solid #222;
      padding: 12px;
      margin-bottom: 10px;
    }
    .admin-post-item h4 { font-size: 8px; color: #ccc; margin-bottom: 5px; }
    .admin-post-item span { font-size: 6px; color: #555; }
    .btn-delete {
      background: #440000;
      color: #ff8888;
      border: 1px solid #ff8888;
      font-size: 6px;
      padding: 5px 8px;
      cursor: pointer;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #000;
      border: 1px solid var(--green-light);
      color: var(--green-light);
      padding: 12px 20px;
      font-size: 7px;
      transition: transform 0.3s;
      z-index: 1000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    #access-denied {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      gap: 20px;
    }
  </style>
</head>
<body>
  <div id="access-denied" style="display:none;">
    <span style="font-size:20px;">&#128274;</span>
    <p style="color:var(--danger);">ACCESO DENEGADO</p>
    <a href="index.html" style="color:var(--admin-border); font-size:8px; text-decoration:none;">&larr; VOLVER</a>
  </div>

  <div id="admin-panel" style="display:none;">
    <div class="admin-header">
      <h1><span>&#10033;</span> PANEL DE DESARROLLADOR</h1>
      <div style="display:flex; align-items:center; gap:20px;">
        <span class="status">Modo oculto activo</span>
        <button class="btn-exit" onclick="cerrarSesion()">&#10005; SALIR</button>
      </div>
    </div>

    <div class="admin-body">
      <div class="section-header"><span>+</span> NUEVA PUBLICACIÓN</div>
      
      <div class="admin-form">
        <label>TIPO DE CONTENIDO</label>
        <select id="tipo-contenido" onchange="cambiarFormulario()">
          <option value="noticia">&#9632; NOTICIA</option>
          <option value="curiosidad">&#9632; DATO CURIOSO</option>
          <option value="quiz">&#9632; QUIZ</option>
        </select>

        <div id="form-noticia">
          <label>Título</label>
          <input type="text" id="n-titulo" placeholder="Título de la noticia..." />
          <label>Imagen (URL, opcional)</label>
          <input type="text" id="n-imagen" placeholder="https://... (opcional)" />
          <label>Texto</label>
          <textarea id="n-texto" placeholder="Escribe el contenido de la noticia..."></textarea>
          <button class="btn-publish" onclick="publicarNoticia()">&#9654; PUBLICAR NOTICIA</button>
        </div>

        <div id="form-curiosidad" style="display:none;">
          <label>Texto del dato curioso</label>
          <textarea id="c-texto" placeholder="Escribe el dato curioso..."></textarea>
          <button class="btn-publish" onclick="publicarCuriosidad()">&#9654; PUBLICAR CURIOSIDAD</button>
        </div>

        <div id="form-quiz" style="display:none;">
          <label>Pregunta</label>
          <input type="text" id="q-pregunta" placeholder="Escribe la pregunta..." />
          <div id="quiz-opciones" style="margin-top:10px;">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
              <input type="radio" name="q-correcta" value="0" checked />
              <input type="text" class="q-opt" placeholder="Opción 1..." />
            </div>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
              <input type="radio" name="q-correcta" value="1" />
              <input type="text" class="q-opt" placeholder="Opción 2..." />
            </div>
          </div>
          <button onclick="addOpcion()" style="background:none; border:none; color:var(--admin-border); font-family:inherit; font-size:7px; cursor:pointer; margin-bottom:15px;">+ AÑADIR OPCIÓN</button>
          <button class="btn-publish" onclick="publicarQuiz()">&#9654; PUBLICAR QUIZ</button>
        </div>
      </div>

      <div class="section-header"><span>&#9632;</span> CONTENIDO PUBLICADO</div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchAdminTab('noticia', this)"><span>&#9632;</span> NOTICIAS</button>
        <button class="tab-btn" onclick="switchAdminTab('curiosidad', this)"><span>&#128161;</span> DATOS CURIOSOS</button>
        <button class="tab-btn" onclick="switchAdminTab('quiz', this)"><span>?</span> QUIZ</button>
      </div>

      <div id="admin-list">No hay contenido publicado.</div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    (function(){
      const _v1 = String.fromCharCode(109, 99, 95, 97, 100, 109, 105, 110);
      const _v2 = String.fromCharCode(116, 114, 117, 101);
      const _gi = id => document.getElementById(id);
      const _ls = () => window.localStorage;

      if(_ls().getItem(_v1) !== _v2) {
        _gi('access-denied').style.display = 'flex';
      } else {
        _gi('admin-panel').style.display = 'block';
        _cF();
        _rAL();
      }

      window.cerrarSesion = () => {
        _ls().removeItem(_v1);
        window.location.href = 'index.html';
      };

      window.cambiarFormulario = _cF;
      window.publicarNoticia = _pN;
      window.publicarCuriosidad = _pC;
      window.publicarQuiz = _pQ;
      window.addOpcion = _aOp;
      window.switchAdminTab = _sAT;
      window.borrarItem = _bI;

      function _gD(t) {
        try { return JSON.parse(_ls().getItem('mc_f_'+t)) || []; }
        catch(e) { return []; }
      }
      function _sD(t,a) { _ls().setItem('mc_f_'+t, JSON.stringify(a)); }
      function _gID() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
      function _fH() { return new Date().toLocaleString('es-ES', {day:'2-digit', month:'long', year:'numeric'}); }
      function _e(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      function _cF() {
        const t = _gi('tipo-contenido').value;
        _gi('form-noticia').style.display = t==='noticia'?'block':'none';
        _gi('form-curiosidad').style.display = t==='curiosidad'?'block':'none';
        _gi('form-quiz').style.display = t==='quiz'?'block':'none';
      }

      function _t(m) {
        const x = _gi('toast');
        x.innerHTML = m;
        x.classList.add('show');
        setTimeout(() => x.classList.remove('show'), 3000);
      }

      function _pN() {
        const ti = _gi('n-titulo').value.trim();
        const im = _gi('n-imagen').value.trim();
        const tx = _gi('n-texto').value.trim();
        if(!ti || !tx) return _t('CAMPOS OBLIGATORIOS');
        const d = _gD('noticia');
        d.unshift({id:_gID(), titulo:ti, imagen:im, texto:tx, fecha:_fH()});
        _sD('noticia', d);
        _gi('n-titulo').value = ''; _gi('n-imagen').value = ''; _gi('n-texto').value = '';
        _t('NOTICIA PUBLICADA'); _rAL();
      }

      function _pC() {
        const tx = _gi('c-texto').value.trim();
        if(!tx) return _t('ESCRIBE ALGO');
        const d = _gD('curiosidad');
        d.unshift({id:_gID(), texto:tx, fecha:_fH()});
        _sD('curiosidad', d);
        _gi('c-texto').value = '';
        _t('CURIOSIDAD PUBLICADA'); _rAL();
      }

      function _pQ() {
        const pr = _gi('q-pregunta').value.trim();
        const ops = Array.from(document.querySelectorAll('.q-opt')).map(o => o.value.trim());
        const cor = document.querySelector('input[name="q-correcta"]:checked');
        if(!pr || ops.some(o => !o) || !cor) return _t('COMPLETA EL QUIZ');
        const d = _gD('quiz');
        d.unshift({id:_gID(), pregunta:pr, opciones:ops, correcta:parseInt(cor.value), fecha:_fH()});
        _sD('quiz', d);
        _gi('q-pregunta').value = '';
        _t('QUIZ PUBLICADO'); _rAL();
      }

      function _aOp() {
        const c = _gi('quiz-opciones');
        const i = c.children.length;
        const d = document.createElement('div');
        d.style.display = 'flex'; d.style.gap = '10px'; d.style.marginBottom = '10px';
        d.innerHTML = `<input type="radio" name="q-correcta" value="${i}"><input type="text" class="q-opt" placeholder="Opción ${i+1}...">`;
        c.appendChild(d);
      }

      let _cT = 'noticia';
      function _sAT(t, b) {
        _cT = t;
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        _rAL();
      }

      function _rAL() {
        const l = _gi('admin-list');
        const d = _gD(_cT);
        l.innerHTML = d.length ? '' : 'No hay contenido publicado.';
        d.forEach(i => {
          const r = document.createElement('div');
          r.className = 'admin-post-item';
          const title = i.titulo || i.pregunta || (i.texto.length > 30 ? i.texto.substring(0,30)+'...' : i.texto);
          r.innerHTML = `<div><h4>${_e(title)}</h4><span>${i.fecha}</span></div><button class="btn-delete" onclick="borrarItem('${i.id}')">ELIMINAR</button>`;
          l.appendChild(r);
        });
      }

      function _bI(id) {
        if(!confirm('¿CONFIRMAR ELIMINACIÓN?')) return;
        let d = _gD(_cT);
        d = d.filter(x => x.id !== id);
        _sD(_cT, d);
        _rAL();
        _t('ELIMINADO');
      }
    })();
  </script>
</body>
</html>
